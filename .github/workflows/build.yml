name: Build Application
on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Set up Python (for CMake Qt tools)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      # Setup MSVC on Windows
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2
        
      # Setup CMake (both platforms)
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.x'
          
      # Linux dependencies
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zlib1g-dev qtbase5-dev qttools5-dev qttools5-dev-tools
          
      # Windows dependencies
      - name: Install ZLIB (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install zlib:x64-windows
          vcpkg integrate install
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows
          
      # Qt installation
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          arch: ${{ runner.os == 'Windows' && 'win64_msvc2019_64' || '' }}
          
      # Java setup (required for building Java components)
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          
      # Build & test
      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        env:
          CMAKE_WARN_DEPRECATED: "OFF"
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" -DCMAKE_DISABLE_FIND_PACKAGE_Qt5LinguistTools=TRUE -DQUAZIP_ENABLE_TESTS=OFF -Wno-dev
        
      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -Wno-dev
        
      - name: Build
        run: cmake --build build --config Release --parallel
        
      - name: Run Tests
        run: ctest --test-dir build --output-on-failure --config Release
        
      - name: Archive artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.os }}
          path: |
            build/*.exe
            build/*.dll
            build/jars/
            !build/**/*.obj
            !build/**/*.pdb