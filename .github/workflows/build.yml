name: Build Application

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python (for CMake Qt tools)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # ---- LINUX DEPENDENCIES ----
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake zlib1g-dev
          # Optionally, you may add other Linux dependencies here

      # ---- QT INSTALLATION (LINUX) ----
      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          # You can specify modules if needed, e.g.:
          # modules: 'qtbase qttools'

      # ---- WINDOWS DEPENDENCIES ----
      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja -y
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y

      - name: Add CMake and Ninja to PATH (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # ---- QT INSTALLATION (WINDOWS) ----
      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          # Remove modules line to avoid aqt issues. Add modules only if verified available.

      # ---- BUILD & TEST ----
      - name: Configure CMake
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure

      - name: Archive artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.os }}
          path: build/
