name: Build Application

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake qtbase5-dev qtchooser qt5-qmake qtbase5-dev-tools libqt5core5a libqt5network5 libqt5gui5

      - name: Build
        run: |
          mkdir build
          cd build
          cmake ..
          make -j$(nproc)

      - name: Debug Build Output
        run: ls -R build

      - name: Verify Build Output
        run: |
          if [ ! -d build/application ]; then
            echo "Build output directory 'build/application' does not exist."
            exit 1
          fi

      - name: Upload Linux Build
        uses: actions/upload-artifact@v3
        with:
          name: arkmc-linux
          path: build/application
  
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
          
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
      - name: Check build output
        run: |
          dir build
          dir build\application || echo "build\\application does not exist"

      - name: Upload Windows Build
        uses: actions/upload-artifact@v3
        with:
          name: arkmc-windows
          path: build/application
          
          mkdir build
          cd build
          cmake -G "MinGW Makefiles" ..
          mingw32-make
          
      - name: Upload Windows Build
        uses: actions/upload-artifact@v3
        with:
          name: arkmc-windows
          path: build/application